plugins {
    id "com.android.application"
}

android {
    namespace "com.kards.app"
    compileSdk 34

    defaultConfig {
        applicationId "com.kards.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// 引擎与 App 同模块：engine 源码在 src/main/java/com/kards/engine，无第三方依赖。
dependencies { }
